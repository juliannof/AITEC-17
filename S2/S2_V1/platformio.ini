[env:lolin_s2_mini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = lolin_s2_mini
framework = arduino

upload_protocol = esptool
upload_port     = /dev/cu.usbmodem01
upload_speed    = 460800

extra_scripts   = pre:pre_build.py
                  pre:pre_upload.py

monitor_port    = /dev/cu.usbmodem01
monitor_speed   = 115200

board_build.arduino.memory_type = qio_qspi
board_build.partitions = partitions_4MB_ota.csv

build_flags =
    -I src
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DARDUINO_USB_DFU_ON_BOOT=0
    -DCONFIG_ESP32_RMT_MEM_BLOCKS=4
    -mfix-esp32-psram-cache-issue
    -Wno-cpp
    -Wno-deprecated-declarations
    -Wno-attributes
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    adafruit/Adafruit NeoPixel
    lovyan03/LovyanGFX@^1.2.19
    lennarthennigs/Button2@^2.5.0
    ayushsharma82/ElegantOTA@^3.1.7
    adafruit/Adafruit ADS1X15@^2.6.2
    adafruit/Adafruit BusIO@^1.17.4

